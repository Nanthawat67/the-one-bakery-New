<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ติดตามออเดอร์ · THE ONE Bakery</title><link rel="stylesheet" href="/css/app.css"></head><body><header class="top"><b>THE ONE Bakery</b><nav><a href="/">สั่งสินค้า</a><a href="/cart.html">ตะกร้า</a></nav></header><main class="wrap"><div class="card"><h2>ติดตามออเดอร์</h2><p class="muted">กรอกหมายเลขออเดอร์ได้ทั้ง <b>4</b>, <b>#4</b> หรือเลขไทย เช่น <b>๔</b> พร้อมเลือกวันที่สั่งซื้อ · หลังสั่งซื้อ ระบบจะเปิดรายการให้อัตโนมัติ</p><form id="f" class="row"><input id="id" type="text" inputmode="numeric" placeholder="เช่น 4 หรือ #4" required><input id="trackDate" type="date" title="วันที่สั่งซื้อ"><button class="btn">ตรวจสอบ</button></form><div id="result" style="margin-top:16px"></div></div></main><script src="/js/api.js"></script><script>
function normalizeOrderNo(v){let s=String(v||'').trim().replace(/^#+/,'');const map={'๐':'0','๑':'1','๒':'2','๓':'3','๔':'4','๕':'5','๖':'6','๗':'7','๘':'8','๙':'9'};s=[...s].map(ch=>map[ch]??ch).join('').replace(/\D/g,'');return s}
function localDate(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'})}
async function loadTrack(raw,forcedId=false){const n=normalizeOrderNo(raw);if(!n){result.textContent='กรุณาระบุหมายเลขออเดอร์';return} id.value=n; result.innerHTML='กำลังโหลด...'; try{const path=forcedId?('/orders/track/'+encodeURIComponent(n)):('/orders/track/number/'+encodeURIComponent(n)+'?date='+encodeURIComponent(trackDate.value||localDate())); const o=await api(path); result.innerHTML=`<h3>ออเดอร์ #${esc(o.daily_no||o.id)}</h3><div class="muted2">รหัสระบบ: ${esc(o.id)}</div><p>วันที่สั่ง: ${new Date(o.created_at).toLocaleString('th-TH')}</p><p>สถานะ: <span class="badge">${esc(o.status)}</span></p><h4>รายการ</h4>${(o.items||[]).map(i=>`<div>${esc(i.name)} × ${esc(i.quantity)} · ${Number(i.unit_price).toFixed(2)} บาท</div>`).join('')||'<div class="muted">ไม่พบรายการสินค้า</div>'}<h4>ประวัติ</h4>${(o.history||[]).length?(o.history||[]).map(h=>`<div>${new Date(h.changed_at).toLocaleString('th-TH')} · ${esc(h.to_status)} · ${esc(h.display_name||'ลูกค้า')}</div>`).join(''):'<div class="muted">ยังไม่มีประวัติการเปลี่ยนสถานะ</div>'}<div class="actions" style="margin-top:18px"><a class="btn" href="/">← กลับหน้าเลือกสินค้า</a><a class="btn secondary" href="/cart.html">ตะกร้าสินค้า</a></div>`}catch(x){result.innerHTML=`<div class="notice">${esc(x.message)}<br><a href="/">กลับไปเลือกสินค้า</a></div>`}}
trackDate.value=localDate();
f.onsubmit=e=>{e.preventDefault();loadTrack(id.value,false)};
const params=new URLSearchParams(location.search);const q=params.get('id')||'';const qDate=params.get('date')||'';if(qDate)trackDate.value=qDate;if(q)loadTrack(q,true);else{const n=params.get('order')||'';if(n)loadTrack(n,false);}
</script></body></html>
