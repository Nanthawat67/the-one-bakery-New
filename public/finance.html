<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Finance</title>
  <link rel="stylesheet" href="/css/app.css">
</head>

<body>
  <header class="top">
    <b>THE ONE Bakery · การเงิน</b>

    <nav>
      <a href="/admin.html">Admin</a>
      <a href="/analytics.html">AI</a>
      <a href="#" onclick="logout()">ออกจากระบบ</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="grid">
      <div class="card">
        <h3>ยอดขายวันนี้</h3>
        <div id="sales" class="stat">0</div>
      </div>

      <div class="card">
        <h3>รายรับอื่น</h3>
        <div id="income" class="stat">0</div>
      </div>

      <div class="card">
        <h3>รายจ่าย</h3>
        <div id="expense" class="stat">0</div>
      </div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>บันทึกรายรับ/รายจ่าย</h2>

      <form id="f" class="form">
        <select id="type">
          <option value="income">รายรับ</option>
          <option value="expense">รายจ่าย</option>
        </select>

        <input
          id="category"
          placeholder="หมวดหมู่ เช่น วัตถุดิบ"
          required
        >

        <input
          id="amount"
          type="number"
          min="0"
          step="0.01"
          placeholder="จำนวนเงิน"
          required
        >

        <input
          id="note"
          placeholder="หมายเหตุ"
        >

        <button class="btn">บันทึก</button>
      </form>
    </section>
  </main>

  <script src="/js/api.js"></script>

  <script>
    requireRole('admin');

    async function load() {
      const d = await api(
        '/finance?date=' + new Date().toISOString().slice(0, 10)
      );

      sales.textContent =
        Number(d.sales).toFixed(2) + ' ฿';

      income.textContent =
        Number(
          d.transactions.find(
            x => x.type === 'income'
          )?.amount || 0
        ).toFixed(2) + ' ฿';

      expense.textContent =
        Number(
          d.transactions.find(
            x => x.type === 'expense'
          )?.amount || 0
        ).toFixed(2) + ' ฿';
    }

    f.onsubmit = async e => {
      e.preventDefault();

      await api('/finance', {
        method: 'POST',
        body: JSON.stringify({
          type: type.value,
          category: category.value,
          amount: Number(amount.value),
          note: note.value
        })
      });

      f.reset();
      load();
    };

    load();
  </script>
</body>
</html>
